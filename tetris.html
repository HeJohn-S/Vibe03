<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테트리스 게임</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            gap: 30px;
            background: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .game-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .game-board {
            width: 300px;
            height: 600px;
            background: #111;
            border: 3px solid #00ff00;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(20, 1fr);
            gap: 1px;
            padding: 5px;
            margin-bottom: 20px;
        }

        .game-cell {
            background: #222;
            border: 1px solid #333;
            width: 100%;
            height: 100%;
        }

        .game-cell.active {
            background: #00ff00;
            box-shadow: 0 0 10px #00ff00;
        }

        .game-cell.filled {
            background: #ffff00;
            box-shadow: 0 0 5px #ffff00;
        }

        .game-cell.i {
            background: #00ffff;
            box-shadow: 0 0 5px #00ffff;
        }

        .game-cell.o {
            background: #ffff00;
            box-shadow: 0 0 5px #ffff00;
        }

        .game-cell.t {
            background: #ff00ff;
            box-shadow: 0 0 5px #ff00ff;
        }

        .game-cell.s {
            background: #00ff00;
            box-shadow: 0 0 5px #00ff00;
        }

        .game-cell.z {
            background: #ff0000;
            box-shadow: 0 0 5px #ff0000;
        }

        .game-cell.j {
            background: #0000ff;
            box-shadow: 0 0 5px #0000ff;
        }

        .game-cell.l {
            background: #ff8800;
            box-shadow: 0 0 5px #ff8800;
        }

        .info-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            color: white;
        }

        .info-panel {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #00ff00;
        }

        .info-panel h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #00ff00;
        }

        .info-panel p {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            text-align: center;
        }

        .next-piece {
            display: grid;
            grid-template-columns: repeat(4, 20px);
            grid-template-rows: repeat(4, 20px);
            gap: 2px;
            margin-top: 10px;
        }

        .next-piece-cell {
            width: 20px;
            height: 20px;
            background: #333;
            border: 1px solid #555;
        }

        .next-piece-cell.active {
            background: #00ff00;
        }

        .controls {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #00ff00;
        }

        .controls h3 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #00ff00;
        }

        .control-item {
            font-size: 14px;
            margin-bottom: 10px;
            color: #fff;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: 2px solid #00ff00;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            box-shadow: 0 0 15px #00ff00;
        }

        button:active {
            transform: scale(0.95);
        }

        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border-radius: 15px;
            border: 3px solid #ff0000;
            text-align: center;
            color: white;
            display: none;
            z-index: 1000;
            min-width: 300px;
        }

        .game-over.show {
            display: block;
        }

        .game-over h2 {
            font-size: 40px;
            color: #ff0000;
            margin-bottom: 20px;
        }

        .game-over p {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .game-over button {
            margin-top: 20px;
            width: 100%;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                gap: 20px;
            }

            .info-section {
                width: 300px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="game-section">
            <div class="game-board" id="gameBoard"></div>
            <button onclick="game.togglePause()">일시정지</button>
        </div>

        <div class="info-section">
            <div class="info-panel">
                <h3>점수</h3>
                <p id="score">0</p>
            </div>

            <div class="info-panel">
                <h3>레벨</h3>
                <p id="level">1</p>
            </div>

            <div class="info-panel">
                <h3>라인</h3>
                <p id="lines">0</p>
            </div>

            <div class="info-panel">
                <h3>다음 블록</h3>
                <div class="next-piece" id="nextPiece"></div>
            </div>

            <div class="controls">
                <h3>조작</h3>
                <div class="control-item">← → : 좌우 이동</div>
                <div class="control-item">↓ : 빠르게 내리기</div>
                <div class="control-item">↑ : 회전</div>
                <div class="control-item">Space : 즉시 낙하</div>
            </div>

            <div class="button-group">
                <button onclick="game.start()">시작</button>
                <button onclick="game.reset()">초기화</button>
            </div>
        </div>
    </div>

    <div class="game-over" id="gameOverModal">
        <h2>게임 오버!</h2>
        <p id="finalScore">점수: 0</p>
        <p id="finalLevel">레벨: 1</p>
        <p id="finalLines">라인: 0</p>
        <button onclick="game.reset()">다시 시작</button>
    </div>

    <script>
        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 20;

        const PIECES = {
            i: {
                shape: [[1, 1, 1, 1]],
                color: 'i'
            },
            o: {
                shape: [[1, 1], [1, 1]],
                color: 'o'
            },
            t: {
                shape: [[0, 1, 0], [1, 1, 1]],
                color: 't'
            },
            s: {
                shape: [[0, 1, 1], [1, 1, 0]],
                color: 's'
            },
            z: {
                shape: [[1, 1, 0], [0, 1, 1]],
                color: 'z'
            },
            j: {
                shape: [[1, 0, 0], [1, 1, 1]],
                color: 'j'
            },
            l: {
                shape: [[0, 0, 1], [1, 1, 1]],
                color: 'l'
            }
        };

        class Tetris {
            constructor() {
                this.board = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));
                this.currentPiece = null;
                this.nextPiece = null;
                this.score = 0;
                this.lines = 0;
                this.level = 1;
                this.gameRunning = false;
                this.gamePaused = false;
                this.gameSpeed = 1000;
                this.gameLoopId = null;
                this.dropLoopId = null;

                this.initBoard();
                this.getNextPiece();
                this.spawnPiece();
            }

            initBoard() {
                const gameBoard = document.getElementById('gameBoard');
                gameBoard.innerHTML = '';
                for (let i = 0; i < ROWS * COLS; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'game-cell';
                    cell.id = `cell-${i}`;
                    gameBoard.appendChild(cell);
                }
            }

            getRandomPiece() {
                const keys = Object.keys(PIECES);
                return keys[Math.floor(Math.random() * keys.length)];
            }

            getNextPiece() {
                const key = this.getRandomPiece();
                this.nextPiece = {
                    type: key,
                    shape: JSON.parse(JSON.stringify(PIECES[key].shape)),
                    color: PIECES[key].color,
                    x: 0,
                    y: 0
                };
                this.renderNextPiece();
            }

            spawnPiece() {
                if (this.nextPiece) {
                    this.currentPiece = this.nextPiece;
                }
                this.currentPiece.x = Math.floor((COLS - this.currentPiece.shape[0].length) / 2);
                this.currentPiece.y = 0;

                if (!this.canMove(this.currentPiece.x, this.currentPiece.y)) {
                    this.gameOver();
                    return;
                }

                this.getNextPiece();
            }

            canMove(x, y, shape = this.currentPiece.shape) {
                for (let row = 0; row < shape.length; row++) {
                    for (let col = 0; col < shape[row].length; col++) {
                        if (!shape[row][col]) continue;

                        const newX = x + col;
                        const newY = y + row;

                        if (newX < 0 || newX >= COLS || newY >= ROWS) return false;
                        if (newY >= 0 && this.board[newY][newX] !== null) return false;
                    }
                }
                return true;
            }

            moveLeft() {
                if (this.canMove(this.currentPiece.x - 1, this.currentPiece.y)) {
                    this.currentPiece.x--;
                }
            }

            moveRight() {
                if (this.canMove(this.currentPiece.x + 1, this.currentPiece.y)) {
                    this.currentPiece.x++;
                }
            }

            moveDown() {
                if (this.canMove(this.currentPiece.x, this.currentPiece.y + 1)) {
                    this.currentPiece.y++;
                    return true;
                } else {
                    this.placePiece();
                    return false;
                }
            }

            hardDrop() {
                while (this.moveDown()) {}
            }

            rotate() {
                const rotated = this.rotateShape(this.currentPiece.shape);
                if (this.canMove(this.currentPiece.x, this.currentPiece.y, rotated)) {
                    this.currentPiece.shape = rotated;
                }
            }

            rotateShape(shape) {
                const rotated = [];
                for (let col = 0; col < shape[0].length; col++) {
                    const newRow = [];
                    for (let row = shape.length - 1; row >= 0; row--) {
                        newRow.push(shape[row][col]);
                    }
                    rotated.push(newRow);
                }
                return rotated;
            }

            placePiece() {
                for (let row = 0; row < this.currentPiece.shape.length; row++) {
                    for (let col = 0; col < this.currentPiece.shape[row].length; col++) {
                        if (!this.currentPiece.shape[row][col]) continue;

                        const y = this.currentPiece.y + row;
                        const x = this.currentPiece.x + col;

                        if (y >= 0) {
                            this.board[y][x] = this.currentPiece.color;
                        }
                    }
                }

                this.clearLines();
                this.spawnPiece();
            }

            clearLines() {
                let linesCleared = 0;

                for (let row = ROWS - 1; row >= 0; row--) {
                    if (this.board[row].every(cell => cell !== null)) {
                        this.board.splice(row, 1);
                        this.board.unshift(Array(COLS).fill(null));
                        linesCleared++;
                    }
                }

                if (linesCleared > 0) {
                    this.lines += linesCleared;
                    this.score += [0, 40, 100, 300, 1200][linesCleared] * this.level;
                    this.level = Math.floor(this.lines / 10) + 1;
                    this.gameSpeed = Math.max(100, 1000 - (this.level - 1) * 100);
                }
            }

            render() {
                const gameBoard = document.getElementById('gameBoard');
                const cells = gameBoard.querySelectorAll('.game-cell');

                for (let row = 0; row < ROWS; row++) {
                    for (let col = 0; col < COLS; col++) {
                        const index = row * COLS + col;
                        const cell = cells[index];
                        cell.className = 'game-cell';

                        if (this.board[row][col]) {
                            cell.classList.add(this.board[row][col]);
                        }
                    }
                }

                if (this.currentPiece) {
                    for (let row = 0; row < this.currentPiece.shape.length; row++) {
                        for (let col = 0; col < this.currentPiece.shape[row].length; col++) {
                            if (!this.currentPiece.shape[row][col]) continue;

                            const y = this.currentPiece.y + row;
                            const x = this.currentPiece.x + col;

                            if (y >= 0 && y < ROWS && x >= 0 && x < COLS) {
                                const index = y * COLS + x;
                                const cell = cells[index];
                                cell.classList.add('active');
                                cell.classList.add(this.currentPiece.color);
                            }
                        }
                    }
                }

                this.updateInfo();
            }

            renderNextPiece() {
                const nextPieceDiv = document.getElementById('nextPiece');
                nextPieceDiv.innerHTML = '';

                for (let i = 0; i < 16; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'next-piece-cell';
                    nextPieceDiv.appendChild(cell);
                }

                const cells = nextPieceDiv.querySelectorAll('.next-piece-cell');
                const shape = this.nextPiece.shape;

                for (let row = 0; row < shape.length; row++) {
                    for (let col = 0; col < shape[row].length; col++) {
                        if (shape[row][col]) {
                            const index = row * 4 + col;
                            cells[index].classList.add('active');
                        }
                    }
                }
            }

            updateInfo() {
                document.getElementById('score').textContent = this.score;
                document.getElementById('level').textContent = this.level;
                document.getElementById('lines').textContent = this.lines;
            }

            gameLoop() {
                if (!this.gamePaused) {
                    this.moveDown();
                }
                this.render();
            }

            start() {
                if (this.gameRunning) return;
                this.gameRunning = true;
                this.gamePaused = false;
                this.gameLoopId = setInterval(() => this.gameLoop(), this.gameSpeed);
            }

            togglePause() {
                if (!this.gameRunning) return;
                this.gamePaused = !this.gamePaused;
            }

            reset() {
                clearInterval(this.gameLoopId);
                this.board = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));
                this.score = 0;
                this.lines = 0;
                this.level = 1;
                this.gameRunning = false;
                this.gamePaused = false;
                this.gameSpeed = 1000;
                this.getNextPiece();
                this.spawnPiece();
                this.render();
                document.getElementById('gameOverModal').classList.remove('show');
            }

            gameOver() {
                clearInterval(this.gameLoopId);
                this.gameRunning = false;
                document.getElementById('finalScore').textContent = `점수: ${this.score}`;
                document.getElementById('finalLevel').textContent = `레벨: ${this.level}`;
                document.getElementById('finalLines').textContent = `라인: ${this.lines}`;
                document.getElementById('gameOverModal').classList.add('show');
            }
        }

        const game = new Tetris();

        document.addEventListener('keydown', (e) => {
            if (!game.gameRunning) return;

            switch(e.key) {
                case 'ArrowLeft':
                    e.preventDefault();
                    game.moveLeft();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    game.moveRight();
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    game.moveDown();
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    game.rotate();
                    break;
                case ' ':
                    e.preventDefault();
                    game.hardDrop();
                    break;
            }
            game.render();
        });

        game.render();
    </script>
</body>
</html>
